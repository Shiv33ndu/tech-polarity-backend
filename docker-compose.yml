services:
  backend:
    image: ghcr.io/REPLACE_WITH_GITHUB_USERNAME/tech_polarity_backend:latest
    container_name: tech-polarity-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: tech-polarity-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"

volumes:
  mongo_data:
